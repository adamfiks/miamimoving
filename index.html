            "@type": "Answer",
            "text": "Local move costs depend on factors like the number of rooms, distance, and additional services (packing, disassembly). We offer free, no-obligation estimates — call us or fill out our quote form for an accurate price."

          "name": "Do you offer same-day moving services?",

          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We recommend decluttering, labeling boxes, securing valuables separately, and ensuring clear pathways. Our team also offers full packing services if you'd prefer to leave it to the pros."
          }
        },

          "name": "What areas do you serve?",

        },

          "name": "What's your cancellation policy?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can cancel or reschedule your move up to 48 hours before the scheduled date at no charge."
          }
        },
        {
          "@type": "Question",
          "name": "Do you provide packing materials?",
          "acceptedAnswer": {
